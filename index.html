const qualityLabels={all:'전체',priority:'우선 분석',review:'스크립트 재검토',hold:'보류',duplicate_review:'중복 의심',out_of_scope_review:'범위 부적합 의심',identity_review:'식별 필요',unreviewed:'정보 부족'};
function setQualityFilter(v){qualityFilter=v;qualityPage=1;drawQuality()}function setQualitySearch(v){qualitySearch=v;qualityPage=1;drawQuality()}
function drawQuality(){if(page!=='quality')return;const summary=document.getElementById('qualitySummary'),container=document.getElementById('qualityRows'),pagination=document.getElementById('qualityPagination');if(!qualityReport){summary.textContent=qualityError||'검수 결과 로딩 중';container.textContent='';pagination.textContent='';return}summary.innerHTML='<div class="grid">'+Object.entries(qualityReport.counts).map(([k,v])=>'<div class="panel"><span class="muted">'+esc(qualityLabels[k]||k)+'</span><div class="metric">'+v+'</div></div>').join('')+'</div><div class="notice">전체 '+qualityReport.total+'개 1차 선별 · 원문 검증 완료를 의미하지 않음</div>';const list=qualityReport.rows.filter(r=>(qualityFilter==='all'||r.grade===qualityFilter)&&r.brand.toLowerCase().includes(qualitySearch.toLowerCase())),max=Math.max(1,Math.ceil(list.length/50));qualityPage=Math.max(1,Math.min(qualityPage,max));container.innerHTML=list.slice((qualityPage-1)*50,qualityPage*50).map(r=>'<div class="panel"><strong>'+esc(r.brand)+'</strong> <span class="tag">'+esc(qualityLabels[r.grade])+'</span><p>'+esc(r.reason)+'</p><span class="muted">원문 검수 대기</span></div>').join('')||'<p>검색 결과 없음</p>';pagination.innerHTML='<button onclick="qualityPage--;drawQuality()" '+(qualityPage<=1?'disabled':'')+'>이전</button><span>'+qualityPage+' / '+max+' · '+list.length+'개</span><button onclick="qualityPage++;drawQuality()" '+(qualityPage>=max?'disabled':'')+'>다음</button>'}
async function fetchQuality(){try{const r=await fetch('./data/quality-review.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);qualityReport=await r.json();qualityError=''}catch(e){qualityError='검수 데이터 로딩 실패: '+e.message}drawQuality()}
function setCandidateQuery(v){candidateQuery=v;candidatePage=1;drawBrandView()}function drawBrandView(){if(page==='overview')drawShortlist();else if(page==='candidates')drawCandidates()}
function candidateRows(){const seen=new Set(records.map(r=>normalizeBrand(r.brand)));const domains=new Set();return candidates.filter(r=>{const k=normalizeBrand(r.brand),d=(r.official_domain||'').toLowerCase().replace(/^www\./,'');if(!k||seen.has(k)||(d&&domains.has(d)))return false;seen.add(k);if(d)domains.add(d);return true})}
function normalizeBrand(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}
function updateCounts(){document.getElementById('scriptNavCount').textContent='('+records.length+')';document.getElementById('candidateNavCount').textContent=candidateLoading?'…':candidateError?'!':'('+candidateRows().length+')';document.getElementById('totalNavCount').textContent='('+shortlist.length+')'}function allBrands(){return [...records.map(r=>({...r,record_kind:'script'})),...candidateRows().map(r=>({...r,record_kind:'candidate'}))]}function exportAllBrands(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(allBrands(),null,2)],{type:'application/json'}));a.download='r-frame-all-brands.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function drawOverview(){const rows=allBrands(),filtered=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(candidateQuery.toLowerCase())),max=Math.max(1,Math.ceil(filtered.length/60));candidatePage=Math.min(max,Math.max(1,candidatePage));document.getElementById('overviewStats').innerHTML='<div class="grid"><div class="panel"><div class="muted">전체 등록 데이터</div><div class="metric">'+(candidateLoading?'로딩 중':rows.length.toLocaleString())+'</div></div><div class="panel"><div class="muted">스크립트 추출 (검수 포함)</div><div class="metric">'+records.length+'</div><button onclick="navigate(\'archive\')">스크립트 보기</button></div><div class="panel"><div class="muted">수집 후보 · 미라벨링</div><div class="metric">'+(candidateLoading?'…':candidateRows().length)+'</div><button onclick="navigate(\'candidates\')">후보 보기</button></div></div><div class="notice">'+(candidateLoading?'데이터를 불러오는 중입니다.':candidateError?esc(candidateError):'데이터 로딩 완료 · 이미지 제외')+(collectionReport?' · 최근 수집 '+esc(new Date(collectionReport.completed_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})):'')+'</div>';document.getElementById('candidateCards').innerHTML=filtered.slice((candidatePage-1)*60,candidatePage*60).map(r=>r.record_kind==='script'?'<article class="panel"><span class="tag">스크립트 추출</span><h2>'+esc(r.script)+'</h2><p>'+esc(r.brand)+' · '+esc(r.type)+'</p><button onclick="showDetail(\''+esc(r.id)+'\')">상세 보기</button></article>':'<article class="panel"><span class="tag">수집 후보 · 미라벨링</span><h2>'+esc(r.brand)+'</h2><p>'+esc(r.source_channel)+' · '+esc(r.category||'미분류')+'</p><a href="'+esc(r.source_url)+'" target="_blank" rel="noopener noreferrer">원본 출처 ↗</a></article>').join('')||'<p>검색 결과가 없습니다.</p>';document.getElementById('candidatePagination').innerHTML='<button onclick="candidatePage--;drawBrandView()" '+(candidatePage<=1?'disabled':'')+'>이전</button><span>'+candidatePage+' / '+max+' · '+filtered.length+'개</span><button onclick="candidatePage++;drawBrandView()" '+(candidatePage>=max?'disabled':'')+'>다음</button>'}function drawCandidates(){const all=candidateRows(),filtered=all.filter(r=>JSON.stringify(r).toLowerCase().includes(candidateQuery.toLowerCase()));let max=Math.max(1,Math.ceil(filtered.length/60));candidatePage=Math.min(max,Math.max(1,candidatePage));document.getElementById('candidateStats').textContent='스크립트 '+records.length+'개 · 수집 후보 '+all.length+'개 · 합계 '+(records.length+all.length)+'개 / 목표 1,000개'+(candidateError?' · '+candidateError:'');document.getElementById('candidateCards').innerHTML=filtered.slice((candidatePage-1)*60,candidatePage*60).map(r=>'<article class="panel"><span class="muted">'+esc(r.source_channel)+' · '+esc(r.category||'미분류')+'</span><h2>'+esc(r.brand)+'</h2><p>스크립트 및 성장 근거 검수 대기'+(r.brand_name_source==='profile_slug_unconfirmed'?' · 이름 확인 필요':'')+'</p><a href="'+esc(r.source_url)+'" target="_blank" rel="noopener noreferrer">원본 출처 ↗</a></article>').join('')||'<p>표시할 후보가 없습니다.</p>';document.getElementById('candidatePagination').innerHTML='<button onclick="candidatePage--;drawCandidates()" '+(candidatePage<=1?'disabled':'')+'>이전</button><span>'+candidatePage+' / '+max+' · '+filtered.length+'개</span><button onclick="candidatePage++;drawCandidates()" '+(candidatePage>=max?'disabled':'')+'>다음</button>'}
function exportCandidates(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(candidateRows(),null,2)],{type:'application/json'}));a.download='brand-candidates.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function fetchCandidates(){candidateLoading=true;candidateError='';updateCounts();try{const r=await fetch(new URL('data/candidates.json',location.href),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d))throw Error('invalid data');candidates=d;try{const report=await fetch(new URL('data/collection-report.json',location.href),{cache:'no-store'});if(report.ok)collectionReport=await report.json()}catch{}}catch(e){candidateError='후보 데이터 로딩 실패: '+e.message}finally{candidateLoading=false;updateCounts();drawBrandView()}}
function drawCards(){const count=document.getElementById('count'),cards=document.getElementById('cards');let list=records.filter(r=>(page!=='saved'||saved.includes(r.id))&&(!type||r.type===type)&&(!value||r.value===value)&&(!status||r.status===status)&&JSON.stringify(r).toLowerCase().includes(query.toLowerCase()));count.textContent=list.length+' SCRIPTS';cards.innerHTML=list.map((r,i)=>`<article class="card" onclick="showDetail('${r.id}')"><div class="visual" style="background:${colors[i%colors.length]}">${esc(r.visual||r.product)}</div><div class="cardbody"><div class="row muted"><span>${esc(r.product)} / ${esc(r.brand)} · ${esc(r.source_channel)}</span><span>${r.status==='example'?'예시':r.status==='verified'?'검증 완료':'검수 대기'}</span></div><h2>${esc(r.script)}</h2><span class="tag">${esc(r.type)}</span><span class="tag">${esc(r.value)}</span><span class="tag">${esc(r.persuasion)}</span><div class="row" style="margin-top:16px"><span class="muted">${esc(r.id)}</span><button onclick="event.stopPropagation();toggle('${r.id}')">${saved.includes(r.id)?'★ 저장됨':'☆ 저장'}</button></div></div></article>`).join('')||'<div class="empty">조건에 맞는 레퍼런스가 없습니다.</div>'}
function showDetail(id){let r=records.find(x=>x.id===id);if(!r)return;detail.innerHTML=`<div class="row"><span class="eyebrow">${esc(r.id)}</span><button onclick="detail.close()">닫기</button></div><h1 style="font-size:30px">${esc(r.script)}</h1><p>${esc(r.brand)} · ${esc(r.product)}</p><div class="panel">${[['주체',r.subject],['관계',r.relationship],['유형',r.type],['연상 가치',r.value],['설득 원리',r.persuasion],['공식',r.formula],['검증 상태',r.status],['성장 근거',r.growth_evidence],['수집 채널',r.source_channel],['검수 참고',r.quality_note],['수집 요약',r.source_summary],['스크립트 출처',r.script_origin]].map(([k,v])=>`<p><strong>${k}</strong> &nbsp; ${esc(v)}</p>`).join('')}</div><h3>출처 / 근거</h3>${(r.sources||[]).map(s=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">출처 열기</a><br>${esc(s.evidence)}</p>`).join('')||'<p>검증된 출처 없음</p>'}<button onclick="navigator.clipboard.writeText(JSON.stringify(records.find(x=>x.id==='${id}'),null,2)).then(()=>alert('복사됨')).catch(()=>alert('복사 권한이 없습니다. JSON 내보내기를 이용하세요.'))">JSON 복사</button> ${r.status==='pending'?`<button onclick="verify('${id}')">근거 확인 후 승인</button>`:''}`;detail.showModal()}
function verify(id){let r=records.find(x=>x.id===id);if(!r.sources?.some(s=>s.url&&s.evidence))return alert('출처와 근거가 필요합니다.');if(confirm('원문이 스크립트의 주장을 직접 뒷받침하는지 확인했습니까?')){r.status='verified';detail.close();refresh()}}
function addRaw(){let b=brand.value.trim(),u=url.value.trim(),t=rawtext.value.trim();if(!b||!/^https?:\/\//i.test(u)||!t)return alert('브랜드, URL, 원문을 입력하세요.');raw.push({id:crypto.randomUUID(),brand:b,url:u,text:t,collected_at:new Date().toISOString()});refresh()}
async function importRaw(el){try{let data=JSON.parse(await el.files[0].text());if(!Array.isArray(data)||!data.every(x=>typeof x.brand==='string'&&typeof x.url==='string'&&/^https?:\/\//i.test(x.url)&&typeof x.text==='string'))throw Error();raw.push(...data.map(x=>({id:crypto.randomUUID(),brand:x.brand,url:x.url,text:x.text,collected_at:new Date().toISOString()})));refresh()}catch{alert('JSON 형식을 확인하세요.')}}function openReview(id){navigate('review');rawselect.value=id;showRaw()}function showRaw(){let r=raw.find(x=>x.id===rawselect.value);rawpreview.textContent=r?r.text:'원본을 선택하세요.'}function addScript(){let r=raw.find(x=>x.id===rawselect.value);if(!r||!script.value.trim()||!product.value.trim()||!evidence.value.trim())return alert('원본, 스크립트, 제품, 근거를 입력하세요.');records.push({id:crypto.randomUUID(),brand:r.brand,script:script.value,product:product.value,subject:subject.value,relationship:relationship.value,type:stype.value,value:svalue.value,persuasion:persuasion.value,formula:formula.value,status:'pending',sources:[{url:r.url,evidence:evidence.value,raw_id:r.id}],label_version:'1.0'});page='archive';query=type=value=status='';refresh()}function exportData(verified=false){let payload={schema_version:'1.0',scripts:records.filter(r=>!verified||r.status==='verified')};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='script-archive.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function safeSource(u){try{const v=new URL(u);return /^https?:$/.test(v.protocol)?v.href:'#'}catch{return '#'}}
function renderShortlist(){main.innerHTML=`<div class="eyebrow">R—FRAME / CURATED COLLECTION</div><h1>Core 100<span style="color:#839174">.</span></h1><p>핵심 브랜드 100개 · 구매 명분 중심의 검수 아카이브. 원본 1,000개는 별도 보존합니다.</p><div id="shortStats"></div><div class="toolbar"><input id="shortSearch" placeholder="브랜드 · 스크립트 · 라벨 검색" value="${esc(shortQuery)}" oninput="shortQuery=this.value;shortPage=1;drawShortlist()"><select onchange="shortFilter=this.value;shortPage=1;drawShortlist()"><option value="all">전체 100개</option><option value="checked">원문 확인</option><option value="pending">검수 대기</option><option value="S">S 등급</option><option value="A">A 등급</option><option value="B">B 등급</option></select><select onchange="shortSort=this.value;shortPage=1;drawShortlist()"><option value="score">점수 높은 순</option><option value="name">브랜드명 순</option><option value="original">선별 순서</option></select><button onclick="exportShortlist()">JSON 내보내기</button></div><div id="shortCards" class="grid"></div><div id="shortPagination" class="row"></div>`;const selects=main.querySelectorAll('select');selects[0].value=shortFilter;selects[1].value=shortSort;drawShortlist()}
function drawShortlist(){if(page!=='overview')return;const stats=document.getElementById('shortStats'),cards=document.getElementById('shortCards'),pagination=document.getElementById('shortPagination');if(!stats||!cards||!pagination)return;const checked=shortlist.filter(r=>r.source_check==='body_checked');stats.innerHTML='<div class="grid">'+[['핵심 선별',shortlist.length],['원문 확인 · 점수 산정',checked.length],['검수 대기',shortlist.length-checked.length]].map(([k,v])=>'<div class="panel"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>').join('')+'</div><div class="notice">검수 대기 데이터는 최종 승인된 사례가 아닙니다. '+esc(shortError)+'</div>';let list=shortlist.filter(r=>(shortFilter==='all'||(shortFilter==='checked'&&r.source_check==='body_checked')||(shortFilter==='pending'&&r.source_check!=='body_checked')||r.grade===shortFilter)&&JSON.stringify(r).toLowerCase().includes(shortQuery.toLowerCase()));if(shortSort==='score')list.sort((a,b)=>(b.score??-1)-(a.score??-1));if(shortSort==='name')list.sort((a,b)=>a.brand.localeCompare(b.brand));const max=Math.max(1,Math.ceil(list.length/25));shortPage=Math.min(max,Math.max(1,shortPage));cards.innerHTML=list.slice((shortPage-1)*25,shortPage*25).map(r=>{const i=shortlist.indexOf(r),ok=r.source_check==='body_checked';return '<article class="panel"><div class="row"><span class="tag">'+(ok?'원문 확인':'검수 대기')+'</span><strong>'+(r.score==null?'미평가':esc(r.grade)+' · '+r.score+'점')+'</strong></div><h2>'+esc(r.brand)+'</h2><p>'+esc(r.script||'스크립트 추출 대기')+'</p>'+(ok?'<span class="tag">'+esc(r.type)+'</span> <span class="tag">'+esc(r.value)+'</span>':r.prior_type?'<span class="tag">기존 분류: '+esc(r.prior_type)+'</span>':'')+'<div class="row" style="margin-top:16px"><button onclick="showShortDetail('+i+')">상세 보기</button><a href="'+esc(safeSource(r.source_url))+'" target="_blank" rel="noopener noreferrer">출처 ↗</a></div></article>'}).join('')||'<p>검색 결과가 없습니다.</p>';pagination.innerHTML='<button onclick="shortPage--;drawShortlist()" '+(shortPage<=1?'disabled':'')+'>이전</button><span>'+shortPage+' / '+max+' · '+list.length+'개</span><button onclick="shortPage++;drawShortlist()" '+(shortPage>=max?'disabled':'')+'>다음</button>'}
function showShortDetail(i){const r=shortlist[i];if(!r)return;const ok=r.source_check==='body_checked';const pairs=[['검수 상태',ok?'원문 확인 기록 있음':'검수 대기'],['점수',r.score==null?'미평가':r.score+' / 100 · '+r.grade],['제품',r.product],['주체',r.subject],['관계',r.relationship],['스크립트 유형',r.type||r.prior_type],['연상 가치',r.value],['설득 원리',r.persuasion],['공식',r.formula],['원문 근거',r.evidence],['성장 근거',r.growth_evidence]];detail.innerHTML='<div class="row"><span class="eyebrow">CORE COLLECTION</span><button onclick="detail.close()">닫기</button></div><h1 style="font-size:30px">'+esc(r.brand)+'</h1><h2>'+esc(r.script||'스크립트 추출 대기')+'</h2>'+pairs.map(([k,v])=>'<p><strong>'+esc(k)+'</strong> · '+esc(v??'미확인')+'</p>').join('')+'<p><a href="'+esc(safeSource(r.source_url))+'" target="_blank" rel="noopener noreferrer">원문 열기 ↗</a></p>';detail.showModal()}
function exportShortlist(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(shortlist,null,2)],{type:'application/json'}));a.download='r-frame-core-100.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function fetchShortlist(){try{const r=await fetch('./data/shortlist.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.rows)||d.rows.length!==100)throw Error('invalid shortlist');shortlist=d.rows;shortError=''}catch(e){shortError='최신 데이터 조회 실패 · 내장 데이터 표시'}updateCounts();drawShortlist()}

render();fetchCandidates();fetchQuality();fetchShortlist();
</script></body></html>
